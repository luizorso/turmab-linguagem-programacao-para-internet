spring.application.name=turmab

#Banco de Dados

spring.datasource.url=jdbc:postgresql://localhost:5432/turmab?useSSL=false&ServerTimeZone=UTC

#Nome do Usuario do PostgreSQL
spring.datasource.username=postgres

#Senha do Usuario do PostgreSQL
spring.datasource.password=postgres

#Define a classe do Driver JDBC
#usada pelo spring para se comunicar com o PostgreSQL

spring.datasource.driver-class-name=org.postgresql.Driver

#Habilita a geração automática de DDL (Data Definition Language)
spring.jpa.generate-ddl=true

#Estratégia de gerencimento de tabelas do hibernate:
#'update'->cria novas tabelas e atualiza colunas de 
#entidades @entity

spring.jpa.hibernate.ddl-auto=update


spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.default_schema=public