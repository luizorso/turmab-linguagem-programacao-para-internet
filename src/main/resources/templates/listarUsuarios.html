<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Listagem de Usuários</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Importação do arquivo styleListar.css -->
        <link rel="stylesheet" th:href="@{/styleListar.css}">
        <!-- Importação do arquivo navbar.css -->
        <link rel="stylesheet" th:href="@{/navbar.css}">
        <!-- Importação do Bootstrap Icons para exibir os ícones nos botões -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <!-- Importação do menu Navbar -->
        <div th:replace="~{fragments/navbar :: menu}"></div>
        <div class="main-container">
            <div class="container">

                <!-- Alertas de Feedback (Sucesso / Exclusão) -->
                <div th:if="${mensagem}" class="alert alert-success">
                    <p th:text="${mensagem}"></p>
                </div>

                <div class="header-actions">
                    <h3>Listagem de Usuários</h3>
                    <a th:href="@{/usuarios/novo}" class="btn-primary">
                        <i class="bi bi-person-plus-fill" style="margin-right: 8px;"></i>Novo Usuário
                    </a>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nome</th>
                                <th>Login</th>
                                <th>Email</th>
                                <th>Perfis</th>
                                <th>Status</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="usuario : ${usuarios}" th:if="${usuario != null}">
                                <td th:text="${usuario.id}"></td>
                                <td th:text="${usuario.nome}"></td>
                                <td th:text="${usuario.login}"></td>
                                <td th:text="${usuario.email}"></td>

                                <!-- Exibição dos Perfis Vinculados (Badges) -->
                                <td>
                                    <div class="profiles-badge-group">
                                        <span th:each="up : ${usuario.perfis}" 
                                              th:text="${up.perfil.nome}" 
                                              class="badge-perfil"></span>
                                        <span th:if="${#lists.isEmpty(usuario.perfis)}" 
                                              class="no-profile-text">Nenhum</span>
                                    </div>
                                </td>

                                <!-- Operador Ternário do Thymeleaf para o status -->
                                <td>
                                    <span th:class="${usuario.status} ? 'status-badge status-ativo' : 'status-badge status-inativo'" 
                                          th:text="${usuario.status} ? 'Ativo' : 'Inativo'"></span>
                                </td>

                                <td class="col-acoes">
                                    <div class="actions-group">
                                        <!-- Editar -->
                                        <a th:href="@{/usuarios/editar/{id} (id=${usuario.id})}"
                                           class="btn-action edit"
                                           title="Editar">
                                            <i class="bi bi-pencil-square"></i> Editar
                                        </a>

                                        <!-- Excluir -->
                                        <form th:action="@{/usuarios/excluir/{id} (id=${usuario.id})}"
                                              method="post"
                                              class="form-delete">
                                            <button type="submit" 
                                                    class="btn-action delete"
                                                    title="Excluir"
                                                    onclick="return confirm('Tem certeza que deseja excluir este utilizador?');">
                                                <i class="bi bi-trash"></i> Excluir
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </body>
</html>
