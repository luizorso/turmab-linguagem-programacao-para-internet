<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title th:text="${titulo}"></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Importação do arquivo styleForm.css -->
        <link rel="stylesheet" th:href="@{/styleForm.css}">
        <!-- importação do arquivo navbar.css -->
        <link rel="stylesheet" th:href="@{/navbar.css}">
        <!-- Importação do Bootstrap Icons para exibir os ícones nos botões -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <style>
            .alert {
                padding: 10px 15px;
                border-radius: 4px;
                margin-bottom: 15px;
                font-size: 14px;
            }
            .alert-success {
                background-color: #d1fae5;
                color: #065f46;
                border: 1px solid #a7f3d0;
            }
            .alert-danger {
                background-color: #fee2e2;
                color: #991b1b;
                border: 1px solid #fca5a5;
            }
            /* Ajuste opcional para o select múltiplo não ficar muito apertado */
            select[multiple] {
                height: 120px;
                padding: 6px;
            }
        </style>
    </head>
    <body>
        <!-- importação do menu navbar -->
        <div th:replace="~{fragments/navbar :: menu}"></div>
        <div class="main-container">

            <!-- Mensagens de Feedback -->
            <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

            <form th:action="@{/usuarios/salvar}" method="post" th:object="${usuarioDTO}">
                <h3 th:text="${titulo}" style="text-align: center;"></h3>
                <input type="hidden" th:field="*{id}">

                <div class="form-group full-width">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}"
                           th:classAppend="${#fields.hasErrors('nome')}? 'is-invalid': ''"/>    
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors='*{nome}'>
                        Erro no nome
                    </div>
                </div>

                <div class="form-group">
                    <label for="login">Login</label>
                    <input type="text" id="login" th:field="*{login}"
                           th:classAppend="${#fields.hasErrors('login')}? 'is-invalid': ''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('login')}" th:errors='*{login}'>
                        Erro no login
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" th:field="*{senha}"
                           th:classAppend="${#fields.hasErrors('senha')}? 'is-invalid':''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}" th:errors='*{senha}'>
                        Erro na senha
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}"
                           th:classAppend="${#fields.hasErrors('email')}? 'is-invalid':''">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors='*{email}'>
                        Erro no email
                    </div>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" th:field="*{status}"
                            th:classAppend="${#fields.hasErrors('status')} ? 'is-invalid' : ''">
                        <option value="true">Ativo</option>
                        <option value="false">Inativo</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">
                        Erro no status!
                    </div>
                </div>

                <!-- Campo de Seleção Múltipla de Perfis integrado ao formulário principal -->
                <div class="form-group full-width">
                    <label for="perfis">Perfis de Acesso</label>
                    <select id="perfis" name="perfisIds" multiple>
                        <option th:each="p : ${todosPerfis}"
                                th:value="${p.id}"
                                th:text="${p.nome}"
                                th:selected="${usuarioDTO.perfisIds != null and usuarioDTO.perfisIds.contains(p.id.toString())}">
                        </option>
                    </select>
                    <small style="color: #64748b; margin-top: 4px; display: block;">
                        Segure a tecla Ctrl (ou Cmd no Mac) para selecionar mais de um perfil.
                    </small>
                </div>

                <div class="form-actions">
                    <a th:href="@{/usuarios}" class="btn-cancel">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-submit">
                        <i class="bi bi-check-lg"></i>
                        <span th:text="${usuarioDTO.id != null ? 'Atualizar' : 'Salvar'}"></span>
                    </button>
                </div>
            </form>

        </div>
    </body>
</html>
