<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Listagem de Perfis</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" 
              th:href="@{styleListar.css}">
    </head>
    <body>
        <div class="container">
            <div th:if="${mensagem}" 
                 style="color: green; font-weight: bold" >
                <p th:text="${mensagem}"></p>
           </div>
           <div class="header-actions">
               <h3>Listagem de Perfis</h3>
               <a th:href="@{/cadastrarPerfil}"
                  class="btn-primary">
                   Novo Perfil
               </a>
                
           </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th colspan="2">Ação</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-th:each="perfil : ${perfis}">
                            <td th:text="${perfil.id}"></td>
                            <td th:text="${perfil.nome}"></td>
                            <td></td>
                            <td></td>
                            
                        </tr>
                                                
                    </tbody>
                </table>
                
                
            </div>
            
            
        </div>
    </body>
</html>
